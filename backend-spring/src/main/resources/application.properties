server.port=8080

# Spring Application Name
spring.application.name=vsm-backend

# MySQL Configuration (Default)
spring.datasource.url=jdbc:mysql://localhost:3306/autopulse_vsm?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=${MYSQL_USER:root}
spring.datasource.password=${MYSQL_PASSWORD:shannu}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# JWT Secret Configuration
jwt.secret=vsms-secret-jwt-token-key-2026-very-secure-must-be-at-least-256-bits-long
jwt.expiration-days=7

# Logging
logging.level.com.autopulse.vsm=INFO
