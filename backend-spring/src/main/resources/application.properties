server.port=${PORT:8080}

# Spring Application Name
spring.application.name=vsm-backend

# MySQL Configuration (Default)
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://${MYSQL_HOST:localhost}:${MYSQL_PORT:3306}/${MYSQL_DATABASE:autopulse_vsm}?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${MYSQL_USER:${SPRING_DATASOURCE_USERNAME:root}}
spring.datasource.password=${MYSQL_PASSWORD:${SPRING_DATASOURCE_PASSWORD:shannu}}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# JWT Secret Configuration
jwt.secret=${JWT_SECRET:vsms-secret-jwt-token-key-2026-very-secure-must-be-at-least-256-bits-long}
jwt.expiration-days=${JWT_EXPIRATION_DAYS:7}

# Logging
logging.level.com.autopulse.vsm=INFO
