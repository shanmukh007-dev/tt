server.port=${PORT:8080}

# Spring Application Name
spring.application.name=vsm-backend

# -------------------------------------------------------------
# Supabase (PostgreSQL) Configuration (Default)
# -------------------------------------------------------------
# Connect via Supabase JDBC Connection String (from Supabase Dashboard -> Database -> Connection String -> JDBC)
# Direct: jdbc:postgresql://db.[PROJECT-REF].supabase.co:5432/postgres?sslmode=require
# Session/Transaction Pooler: jdbc:postgresql://aws-0-[REGION].pooler.supabase.com:6543/postgres?sslmode=require
spring.datasource.url=${SPRING_DATASOURCE_URL:${SUPABASE_DB_URL:jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:postgres}?sslmode=require}}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:${SUPABASE_DB_USER:${DB_USER:postgres}}}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:${SUPABASE_DB_PASSWORD:${DB_PASSWORD:postgres}}}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# JWT Secret Configuration
jwt.secret=${JWT_SECRET:vsms-secret-jwt-token-key-2026-very-secure-must-be-at-least-256-bits-long}
jwt.expiration-days=${JWT_EXPIRATION_DAYS:7}

# Logging
logging.level.com.autopulse.vsm=INFO
